<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Explorer</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101722;
    color: white;
}

#startBox {
    width: 350px;
    padding: 30px;
    text-align: center;
    background: #182131;
    border-radius: 15px;
}

#startBox h1 {
    margin-top: 0;
}

#nameInput {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
}

#playButton {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #4287ff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#status {
    margin-top: 10px;
    font-size: 13px;
    color: #aaa;
}

#hud {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 5;
    color: white;
    background: rgba(0,0,0,.45);
    padding: 8px 12px;
    border-radius: 8px;
    pointer-events: none;
}

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 8px;
    height: 8px;
    margin-left: -4px;
    margin-top: -4px;
    z-index: 4;
    pointer-events: none;
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: white;
}

#crosshair::before {
    width: 8px;
    height: 1px;
    top: 3px;
}

#crosshair::after {
    width: 1px;
    height: 8px;
    left: 3px;
}
</style>
</head>

<body>

<div id="startScreen">
    <div id="startBox">
        <h1>3D Explorer</h1>

        <p>
            <b>W</b> = move forward<br>
            <b>Mouse</b> = look around
        </p>

        <input
            id="nameInput"
            maxlength="16"
            value="Player"
            placeholder="Your name"
        >

        <button id="playButton">
            PLAY
        </button>

        <div id="status">
            Connecting...
        </div>
    </div>
</div>

<div id="hud">
    Players: <span id="playerCount">1</span>
</div>

<div id="crosshair"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   THREE.JS
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87b8e6);

scene.fog = new THREE.Fog(
    0x87b8e6,
    40,
    180
);


const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.05,
        500
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHT
===================================================== */

const hemisphere =
    new THREE.HemisphereLight(
        0xffffff,
        0x405040,
        1.8
    );

scene.add(hemisphere);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    40,
    70,
    20
);

sun.castShadow = true;

scene.add(sun);


/* =====================================================
   GROUND
===================================================== */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            500,
            500
        ),
        new THREE.MeshStandardMaterial({
            color: 0x477a42
        })
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =====================================================
   DETERMINISTIC RANDOM
===================================================== */

let seed = 123456789;

function random() {

    seed =
        (seed * 1664525 +
        1013904223) >>> 0;

    return seed / 4294967296;
}


/* =====================================================
   TREES
===================================================== */

function createTree(x, z) {

    const tree =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .25,
                .35,
                3,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x68452c
            })
        );

    trunk.position.y = 1.5;

    trunk.castShadow = true;

    tree.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                2,
                4.5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x245c2b
            })
        );

    leaves.position.y = 4;

    leaves.castShadow = true;

    tree.add(leaves);


    tree.position.set(
        x,
        0,
        z
    );

    scene.add(tree);
}


for (let i = 0; i < 70; i++) {

    const x =
        (random() - .5) * 180;

    const z =
        (random() - .5) * 180;


    if (
        Math.abs(x) < 15 &&
        Math.abs(z) < 15
    ) {
        continue;
    }

    createTree(x, z);
}


/* =====================================================
   BUILDINGS
===================================================== */

function createBuilding(
    x,
    z,
    width,
    height,
    depth
) {

    const building =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            new THREE.MeshStandardMaterial({
                color: 0x747b87
            })
        );


    building.position.set(
        x,
        height / 2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);
}


createBuilding(
    -18,
    -20,
    12,
    10,
    12
);

createBuilding(
    18,
    -28,
    16,
    14,
    10
);

createBuilding(
    30,
    10,
    10,
    8,
    18
);

createBuilding(
    -30,
    25,
    18,
    12,
    12
);

createBuilding(
    0,
    40,
    20,
    16,
    10
);


/* =====================================================
   PLAYER
===================================================== */

const player = {

    position:
        new THREE.Vector3(
            0,
            1.7,
            8
        ),

    yaw: 0,

    pitch: 0
};


camera.position.copy(
    player.position
);


/* =====================================================
   GAME STATE
===================================================== */

let gameStarted = false;


/* =====================================================
   W KEY ONLY
===================================================== */

let wPressed = false;


window.addEventListener(
    "keydown",
    event => {

        if (event.code === "KeyW") {

            wPressed = true;

            event.preventDefault();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        if (event.code === "KeyW") {

            wPressed = false;

            event.preventDefault();
        }
    }
);


window.addEventListener(
    "blur",
    () => {

        wPressed = false;
    }
);


/* =====================================================
   MOUSE LOOK
===================================================== */

let mouseLocked = false;


renderer.domElement.addEventListener(
    "click",
    () => {

        if (gameStarted) {

            renderer.domElement
                .requestPointerLock();
        }
    }
);


document.addEventListener(
    "pointerlockchange",
    () => {

        mouseLocked =
            document.pointerLockElement ===
            renderer.domElement;
    }
);


document.addEventListener(
    "mousemove",
    event => {

        if (!mouseLocked) {
            return;
        }


        player.yaw -=
            event.movementX * 0.0025;


        player.pitch -=
            event.movementY * 0.0025;


        player.pitch =
            THREE.MathUtils.clamp(
                player.pitch,
                -1.45,
                1.45
            );


        camera.rotation.order =
            "YXZ";


        camera.rotation.y =
            player.yaw;


        camera.rotation.x =
            player.pitch;
    }
);


/* =====================================================
   MOVEMENT
===================================================== */

function movePlayer(delta) {

    if (!wPressed) {
        return;
    }


    const speed = 6;


    /*
       This is the ONLY movement direction.

       W always moves in the direction
       the player is looking.
    */

    const forwardX =
        Math.sin(player.yaw);

    const forwardZ =
        -Math.cos(player.yaw);


    player.position.x +=
        forwardX *
        speed *
        delta;


    player.position.z +=
        forwardZ *
        speed *
        delta;


    camera.position.copy(
        player.position
    );
}


/* =====================================================
   MULTIPLAYER
===================================================== */

let socket = null;
let myId = null;

const remotePlayers =
    new Map();


function createNameSprite(name) {

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 512;
    canvas.height = 128;


    const ctx =
        canvas.getContext("2d");


    ctx.font =
        "bold 48px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        "rgba(0,0,0,.65)";

    ctx.fillRect(
        60,
        15,
        392,
        98
    );


    ctx.fillStyle =
        "white";


    ctx.fillText(
        name,
        256,
        64
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });


    const sprite =
        new THREE.Sprite(
            material
        );


    sprite.scale.set(
        3.2,
        .8,
        1
    );


    return sprite;
}


function createRemotePlayer(data) {

    const group =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .38,
                1,
                5,
                10
            ),
            new THREE.MeshStandardMaterial({
                color: 0x4c8dff
            })
        );


    body.position.y =
        .75;

    group.add(body);


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .34,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffd0a0
            })
        );


    head.position.y =
        1.65;

    group.add(head);


    const name =
        createNameSprite(
            data.name || "Player"
        );


    name.position.y =
        2.35;

    group.add(name);


    group.position.set(
        data.x,
        data.y - 1.7,
        data.z
    );


    scene.add(group);


    return {

        mesh: group,

        target:
            new THREE.Vector3(
                data.x,
                data.y - 1.7,
                data.z
            ),

        yaw:
            data.yaw || 0
    };
}


/* =====================================================
   CONNECT
===================================================== */

function connectMultiplayer() {

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";


    const url =
        `${protocol}//${location.host}/ws`;


    try {

        socket =
            new WebSocket(url);

    } catch {

        return;
    }


    socket.addEventListener(
        "open",
        () => {

            document.getElementById(
                "status"
            ).textContent =
                "Connected";


            socket.send(
                JSON.stringify({
                    type: "join",

                    name:
                        document.getElementById(
                            "nameInput"
                        ).value ||
                        "Player"
                })
            );
        }
    );


    socket.addEventListener(
        "message",
        event => {

            let data;

            try {

                data =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }


            if (
                data.type ===
                "welcome"
            ) {

                myId =
                    data.id;

                return;
            }


            if (
                data.type ===
                "snapshot"
            ) {

                const seen =
                    new Set();


                for (
                    const p
                    of data.players
                ) {

                    if (
                        p.id === myId
                    ) {
                        continue;
                    }


                    seen.add(
                        p.id
                    );


                    let remote =
                        remotePlayers.get(
                            p.id
                        );


                    if (!remote) {

                        remote =
                            createRemotePlayer(
                                p
                            );

                        remotePlayers.set(
                            p.id,
                            remote
                        );

                    } else {

                        remote.target.set(
                            p.x,
                            p.y - 1.7,
                            p.z
                        );

                        remote.yaw =
                            p.yaw || 0;
                    }
                }


                for (
                    const [
                        id,
                        remote
                    ]
                    of remotePlayers
                ) {

                    if (
                        !seen.has(id)
                    ) {

                        scene.remove(
                            remote.mesh
                        );

                        remotePlayers.delete(
                            id
                        );
                    }
                }


                document.getElementById(
                    "playerCount"
                ).textContent =
                    data.players.length;
            }
        }
    );


    socket.addEventListener(
        "close",
        () => {

            document.getElementById(
                "status"
            ).textContent =
                "Disconnected";

            setTimeout(
                connectMultiplayer,
                3000
            );
        }
    );
}


/* =====================================================
   SEND POSITION
===================================================== */

let lastSend = 0;


function sendPosition(time) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {
        return;
    }


    if (
        time - lastSend < 50
    ) {
        return;
    }


    lastSend = time;


    socket.send(
        JSON.stringify({

            type: "move",

            x:
                player.position.x,

            y:
                player.position.y,

            z:
                player.position.z,

            yaw:
                player.yaw
        })
    );
}


/* =====================================================
   UPDATE REMOTE PLAYERS
===================================================== */

function updateRemotePlayers() {

    for (
        const remote
        of remotePlayers.values()
    ) {

        remote.mesh.position.lerp(
            remote.target,
            .25
        );

        remote.mesh.rotation.y =
            remote.yaw;
    }
}


/* =====================================================
   START
===================================================== */

document.getElementById(
    "playButton"
).addEventListener(
    "click",
    () => {

        gameStarted = true;


        document.getElementById(
            "startScreen"
        ).style.display =
            "none";


        camera.position.copy(
            player.position
        );


        camera.rotation.order =
            "YXZ";


        connectMultiplayer();


        setTimeout(
            () => {

                renderer.domElement
                    .requestPointerLock();

            },
            100
        );
    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =====================================================
   GAME LOOP
===================================================== */

const clock =
    new THREE.Clock();


function animate(time) {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    if (gameStarted) {

        movePlayer(delta);

        sendPosition(
            performance.now()
        );
    }


    updateRemotePlayers();


    renderer.render(
        scene,
        camera
    );
}


animate();

</script>

</body>
</html>
